name: EAS Production Build (main)

# Production builds are manually triggered only — store submissions
# shouldn't happen automatically on every merge to main. Run this from the
# Actions tab ("Run workflow") once main has the release you want to ship.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options: [all, android, ios]
      submit:
        description: 'Also submit to the app store(s) after a successful build'
        required: true
        default: false
        type: boolean

jobs:
  eas-production:
    name: Build production (${{ inputs.platform }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build production
        run: eas build --platform ${{ inputs.platform }} --profile production --non-interactive

      - name: Submit to app store(s)
        if: ${{ inputs.submit }}
        run: eas submit --platform ${{ inputs.platform }} --profile production --non-interactive --latest
